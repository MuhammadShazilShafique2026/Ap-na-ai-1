<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Apna AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <div class="logo-icon">✦</div>
            <span>Apna AI</span>
        </div>

        <button class="new-chat" onclick="newChat()">

            <svg width="19" height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round">

                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>

            </svg>

            <span>New chat</span>

        </button>


        <div class="sidebar-title">
            Recent
        </div>


        <div class="chat-history">

            <div class="history-item">
                ✦ Welcome to Apna AI
            </div>

            <div class="history-item">
                AI Assistant
            </div>

        </div>


        <div class="sidebar-bottom">

            <button>

                <svg width="18" height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">

                    <circle
                        cx="12"
                        cy="12"
                        r="3">
                    </circle>

                    <path
                        d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.4 1.4-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V20h-2v-.51a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-1.4-1.4.06-.06A1.7 1.7 0 0 0 9.6 15a1.7 1.7 0 0 0-1.55-1H7v-2h1.05a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.4-1.4.06.06A1.7 1.7 0 0 0 9.6 9a1.7 1.7 0 0 0-1.55 1H7v2h1.05a1.7 1.7 0 0 0 1.55 1z">
                    </path>

                </svg>

                <span>Settings</span>

            </button>


            <button>

                <svg width="18" height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">

                    <circle
                        cx="12"
                        cy="8"
                        r="4">
                    </circle>

                    <path
                        d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                    </path>

                </svg>

                <span>Account</span>

            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <button
                class="menu-btn"
                onclick="toggleSidebar()"
                aria-label="Open menu">

                <svg width="21" height="21"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round">

                    <path d="M4 6h16"></path>
                    <path d="M4 12h16"></path>
                    <path d="M4 18h16"></path>

                </svg>

            </button>


            <div class="top-title">

                <span>Apna AI</span>

                <span class="status-dot"></span>

            </div>


            <button
                class="top-button"
                aria-label="More options">

                <svg width="20" height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round">

                    <circle
                        cx="5"
                        cy="12"
                        r="1">
                    </circle>

                    <circle
                        cx="12"
                        cy="12"
                        r="1">
                    </circle>

                    <circle
                        cx="19"
                        cy="12"
                        r="1">
                    </circle>

                </svg>

            </button>

        </header>



        <!-- =========================
             CHAT AREA
        ========================== -->

        <section
            class="chat-area"
            id="chatArea">


            <!-- WELCOME -->

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-logo">
                    ✦
                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    Ask anything, learn something new,
                    or create something amazing.
                </p>


                <!-- SUGGESTIONS -->

                <div class="suggestions">


                    <button
                        onclick="useSuggestion('Create a modern website for me')">

                        <span>🌐</span>

                        <div>

                            <strong>
                                Create a website
                            </strong>

                            <small>
                                Build a modern website
                            </small>

                        </div>

                    </button>


                    <button
                        onclick="useSuggestion('Explain JavaScript in simple words')">

                        <span>💻</span>

                        <div>

                            <strong>
                                Learn JavaScript
                            </strong>

                            <small>
                                Explain it simply
                            </small>

                        </div>

                    </button>


                    <button
                        onclick="useSuggestion('Give me a unique business idea')">

                        <span>💡</span>

                        <div>

                            <strong>
                                Get ideas
                            </strong>

                            <small>
                                Find creative ideas
                            </small>

                        </div>

                    </button>


                    <button
                        onclick="useSuggestion('Write a YouTube Shorts script for me')">

                        <span>🎬</span>

                        <div>

                            <strong>
                                Create a script
                            </strong>

                            <small>
                                Make a YouTube script
                            </small>

                        </div>

                    </button>

                </div>

            </div>

        </section>



        <!-- =========================
             INPUT
        ========================== -->

        <div class="input-wrapper">

            <div class="input-box">


                <!-- ATTACHMENT -->

                <button
                    class="input-button"
                    id="attachmentButton"
                    onclick="document.getElementById('fileInput').click()"
                    aria-label="Attach file"
                    title="Attach file">

                    <svg width="21" height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                        </path>

                    </svg>

                </button>


                <input
                    type="file"
                    id="fileInput"
                    hidden>


                <!-- MESSAGE INPUT -->

                <textarea
                    id="messageInput"
                    placeholder="Message Apna AI..."
                    rows="1"
                    autocomplete="off">
                </textarea>


                <!-- =========================
                     ACTION BUTTON
                ========================== -->

                <button
                    class="action-button"
                    id="actionButton"
                    onclick="handleAction()"
                    aria-label="Voice"
                    title="Voice">


                    <!-- MIC -->

                    <svg
                        id="micIcon"
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <rect
                            x="9"
                            y="2"
                            width="6"
                            height="12"
                            rx="3">
                        </rect>

                        <path
                            d="M5 10v2a7 7 0 0 0 14 0v-2">
                        </path>

                        <path
                            d="M12 19v3">
                        </path>

                        <path
                            d="M8 22h8">
                        </path>

                    </svg>


                    <!-- SEND -->

                    <svg
                        id="sendIcon"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path d="M12 19V5"></path>

                        <path d="M6 11l6-6 6 6"></path>

                    </svg>

                </button>

            </div>


            <p class="footer-text">
                Apna AI can make mistakes. Check important information.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
